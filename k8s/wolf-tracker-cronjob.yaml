---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wolf-tracker-script
  namespace: biodiversity
data:
  fetch.sh: |
    #!/bin/sh
    set -eu

    SOURCE_URL="https://storage.googleapis.com/cdfw-wolf-tracker/wolf_bins.geojson"
    BUCKET="public-ca-wolves"
    S3_ENDPOINT="http://rook-ceph-rgw-nautiluss3.rook"

    # Get Last-Modified from upstream (used as the snapshot key)
    LAST_MOD_RAW=$(curl -sI "$SOURCE_URL" | grep -i "^last-modified:" | sed 's/[Ll]ast-[Mm]odified: //;s/\r//')
    if [ -z "$LAST_MOD_RAW" ]; then
      echo "ERROR: could not read Last-Modified header" >&2
      exit 1
    fi

    # Convert "Fri, 10 Apr 2026 21:00:35 GMT" -> "2026-04-10T21:00:35"
    TIMESTAMP=$(date -u -d "$LAST_MOD_RAW" +%Y-%m-%dT%H:%M:%S)
    SNAPSHOT="snapshots/wolf_bins_${TIMESTAMP}.geojson"

    echo "Upstream Last-Modified: $LAST_MOD_RAW"
    echo "Snapshot key: $SNAPSHOT"

    # Archive a new snapshot only if upstream has changed; the assemble step
    # below still runs unconditionally so the 30-day rolling window slides
    # forward every cron tick.
    if aws s3 ls "s3://${BUCKET}/${SNAPSHOT}" \
         --endpoint-url "$S3_ENDPOINT" \
         --region us-east-1 \
         2>/dev/null | grep -q .; then
      echo "Snapshot already stored — no new upstream data."
    else
      echo "New data detected — saving snapshot..."
      curl -sf "$SOURCE_URL" | \
        aws s3 cp - "s3://${BUCKET}/${SNAPSHOT}" \
          --endpoint-url "$S3_ENDPOINT" \
          --region us-east-1 \
          --content-type "application/geo+json"

      # Also write to a fixed key so the map can always load the latest snapshot
      aws s3 cp "s3://${BUCKET}/${SNAPSHOT}" "s3://${BUCKET}/wolf_bins_latest.geojson" \
        --endpoint-url "$S3_ENDPOINT" \
        --region us-east-1 \
        --content-type "application/geo+json"

      echo "Saved: s3://${BUCKET}/${SNAPSHOT}"
      echo "Updated: s3://${BUCKET}/wolf_bins_latest.geojson"
    fi

    # Fold any snapshot the history table does not hold yet into
    # wolf_bins_history.parquet; assemble.py reads that table, not the files.
    python3 /scripts/consolidate.py

    # Always rebuild the trail hex parquet and tracks geojson — even with no
    # new snapshot, day-31 features age out of the 30-day window.
    python3 /scripts/assemble.py

  consolidate.py: |
    #!/usr/bin/env python3
    """Fold CDFW's wolf_bins snapshots into one GeoParquet table.

    CDFW publishes one overwritten file and keeps no history, so our snapshots
    are the only record of what it published. This keeps that record losslessly
    in one table, wolf_bins_history.parquet, instead of one GeoJSON per poll:

      snapshot_ts      TIMESTAMP  upstream Last-Modified (UTC) of the snapshot
      feature_index    INTEGER    the feature's position in that snapshot
      pack             VARCHAR    wolf id; upstream called it `name` 2026-10-30..11-02
      pack_origin      VARCHAR    NULL before upstream added it
      most_recent_adj  VARCHAR    upstream date string, as published
      properties       JSON       every upstream property, verbatim and in order
      geometry         GEOMETRY   the hexbin polygon, as published

    `properties` is the record; the typed columns are conveniences. A field that
    upstream adds or renames lands in `properties` with no schema change. Grouping
    by snapshot_ts and ordering by feature_index rebuilds any snapshot exactly.

    Each run appends every snapshot under snapshots/ that the table does not yet
    hold, so a run that fails is caught up by the next one. The table is
    rewritten whole (it is small) and is never uploaded with fewer rows than it
    had. The local copy is left at LOCAL for assemble.py.
    """
    import json, os, subprocess, sys

    import duckdb

    EP = os.environ.get("S3_ENDPOINT", "http://rook-ceph-rgw-nautiluss3.rook")
    BUCKET = os.environ.get("BUCKET", "public-ca-wolves")
    KEY = "wolf_bins_history.parquet"
    LOCAL = "/tmp/wolf_bins_history.parquet"


    def aws(*args):
        return subprocess.run(
            ["aws"] + list(args) + ["--endpoint-url", EP, "--region", "us-east-1"],
            capture_output=True, text=True,
        )


    def die(msg):
        print(f"ERROR: {msg}", file=sys.stderr)
        sys.exit(1)


    def snapshot_ts(fname):
        """'wolf_bins_2026-04-10T21:00:35.geojson' -> '2026-04-10T21:00:35'."""
        if not (fname.startswith("wolf_bins_") and fname.endswith(".geojson")):
            return None
        return fname[len("wolf_bins_"):-len(".geojson")]


    con = duckdb.connect()
    con.execute("INSTALL spatial; LOAD spatial;")
    con.execute("SET TimeZone='UTC';")

    # ---- The table so far -----------------------------------------------------
    head = aws("s3api", "head-object", "--bucket", BUCKET, "--key", KEY)
    if head.returncode == 0:
        r = aws("s3", "cp", f"s3://{BUCKET}/{KEY}", LOCAL)
        if r.returncode != 0:
            die(f"downloading {KEY}: {r.stderr}")
        con.execute(f"CREATE TABLE history AS SELECT * FROM read_parquet('{LOCAL}')")
    elif "Not Found" in head.stderr or "404" in head.stderr:
        print(f"{KEY} does not exist yet; building it from every snapshot.")
        con.execute("""
            CREATE TABLE history (
                snapshot_ts TIMESTAMP, feature_index INTEGER, pack VARCHAR,
                pack_origin VARCHAR, most_recent_adj VARCHAR, properties JSON,
                geometry GEOMETRY)
        """)
    else:
        die(f"checking for {KEY}: {head.stderr}")

    before = con.execute("SELECT count(*) FROM history").fetchone()[0]
    have = {r[0] for r in con.execute(
        "SELECT DISTINCT strftime(snapshot_ts, '%Y-%m-%dT%H:%M:%S') FROM history"
    ).fetchall()}

    # ---- Snapshots it does not hold yet ---------------------------------------
    r = aws("s3", "ls", f"s3://{BUCKET}/snapshots/")
    if r.returncode != 0:
        die(f"listing snapshots: {r.stderr}")
    pending = []
    for line in r.stdout.splitlines():
        if not line.strip():
            continue
        fname = line.split()[-1]
        ts = snapshot_ts(fname)
        if ts and ts not in have:
            pending.append((ts, fname))
    pending.sort()

    if not pending:
        print(f"{KEY}: up to date, {before} rows.")
        if not os.path.exists(LOCAL):
            die(f"{KEY} has no local copy")  # cannot happen: no table means pending
        sys.exit(0)

    rows = []
    for ts, fname in pending:
        r = aws("s3", "cp", f"s3://{BUCKET}/snapshots/{fname}", "-")
        if r.returncode != 0:
            # Not in the table, so the next run retries it.
            print(f"WARNING: could not read {fname}: {r.stderr}", file=sys.stderr)
            continue
        try:
            data = json.loads(r.stdout)
        except ValueError as e:
            print(f"WARNING: {fname} is not JSON: {e}", file=sys.stderr)
            continue
        for i, feat in enumerate(data["features"]):
            p = feat["properties"]
            rows.append((
                ts, i, p.get("pack", p.get("name")), p.get("pack_origin"),
                p.get("most_recent_adj"),
                json.dumps(p, ensure_ascii=False, separators=(",", ":")),
                json.dumps(feat["geometry"], separators=(",", ":")),
            ))

    con.execute("""
        CREATE TEMP TABLE incoming (
            snapshot_ts VARCHAR, feature_index INTEGER, pack VARCHAR,
            pack_origin VARCHAR, most_recent_adj VARCHAR, properties VARCHAR,
            geometry VARCHAR)
    """)
    if rows:
        con.executemany("INSERT INTO incoming VALUES (?, ?, ?, ?, ?, ?, ?)", rows)
    con.execute("""
        INSERT INTO history
        SELECT CAST(snapshot_ts AS TIMESTAMP), feature_index, pack, pack_origin,
               most_recent_adj, CAST(properties AS JSON),
               ST_GeomFromGeoJSON(geometry)
        FROM incoming
    """)

    after = con.execute("SELECT count(*) FROM history").fetchone()[0]
    if after != before + len(rows) or after < before:
        die(f"row count {after} != {before} + {len(rows)}; not uploading")

    tmp = LOCAL + ".new"
    con.execute(f"""
        COPY (SELECT * FROM history ORDER BY snapshot_ts, feature_index)
        TO '{tmp}' (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)
    """)
    con.close()
    os.replace(tmp, LOCAL)

    r = aws("s3", "cp", LOCAL, f"s3://{BUCKET}/{KEY}",
            "--content-type", "application/vnd.apache.parquet")
    if r.returncode != 0:
        die(f"uploading {KEY}: {r.stderr}")
    print(f"{KEY}: added {len(rows)} rows from {len(pending)} snapshots, now {after} rows.")

  assemble.py: |
    #!/usr/bin/env python3
    """Rebuild the queryable trail and the map's UI geojson from the snapshot
    history table (wolf_bins_history.parquet, kept by consolidate.py).

    Outputs (all overwritten in place each run):

      wolf_tracks.geojson        — per-wolf LineStrings through consecutive
                                   hexbin centroids, used by the map's playback
                                   layer. Visualization only. Each waypoint
                                   carries the window its cell was reported over
                                   (`timestamps` / `end_timestamps`), so the map
                                   can show the observations themselves rather
                                   than a path between them.
      wolf_trail/hex/h0=*/data_0.parquet
                                 — canonical analytical asset. Past 30 days of
                                   (pack, reporting window, hexbin polygon)
                                   polyfilled to H3 res 8 cells, hive-partitioned
                                   by h0. Joins against any catalog hex dataset
                                   via h8; h0 partition column enables DPP against
                                   global datasets. Built with DuckDB + spatial
                                   + h3 community extensions, matching the
                                   convention in cng_datasets/vector/h3_tiling.py.

    One row per (wolf, cell, reporting window): CDFW republishes a wolf's cell
    in every snapshot until it moves, so consecutive republications of the same
    cell collapse into one row spanning `snapshot_ts` (first reported) to
    `last_seen_ts` (last reported). A wolf missing from intervening snapshots
    breaks the window, so gaps in reporting survive into the data.

    wolf_bins_latest.geojson is written by fetch.sh (current snapshot only) and
    is not touched here. Current positions in SQL are
    `trail WHERE last_seen_ts = (SELECT MAX(last_seen_ts) FROM trail)` — keying
    off MAX(snapshot_ts) instead would drop every wolf that hasn't moved lately.
    """
    import json, os, shutil, subprocess, sys
    from datetime import datetime, timedelta

    import duckdb

    EP = os.environ.get("S3_ENDPOINT", "http://rook-ceph-rgw-nautiluss3.rook")
    BUCKET = "public-ca-wolves"
    LOOKBACK_DAYS = 30
    H3_RES = 8  # working resolution; matches public-ecoregion
    cutoff = datetime.now(tz=None) - timedelta(days=LOOKBACK_DAYS)  # naive UTC

    def s3(*args):
        return subprocess.run(
            ["aws", "s3"] + list(args) +
            ["--endpoint-url", EP, "--region", "us-east-1"],
            capture_output=True, text=True,
        )

    # Snapshots in the lookback window, rebuilt from the history table that
    # consolidate.py keeps (and leaves at HISTORY) rather than one GET per file.
    HISTORY = "/tmp/wolf_bins_history.parquet"
    hcon = duckdb.connect()
    hcon.execute("INSTALL spatial; LOAD spatial;")
    hrows = hcon.execute(f"""
        SELECT strftime(snapshot_ts, '%Y-%m-%dT%H:%M:%S'), properties,
               ST_AsGeoJSON(geometry)
        FROM read_parquet('{HISTORY}')
        WHERE snapshot_ts >= ?
        ORDER BY snapshot_ts, feature_index
    """, [cutoff]).fetchall()
    hcon.close()

    recent = []  # [(ts_str, FeatureCollection)], oldest first
    for ts_str, props, geom in hrows:
        if not recent or recent[-1][0] != ts_str:
            recent.append((ts_str, {"type": "FeatureCollection", "features": []}))
        recent[-1][1]["features"].append({
            "type": "Feature",
            "properties": json.loads(props),
            "geometry": json.loads(geom),
        })

    trail_features = []
    tracks = {}          # pack -> [{"coords": [lon, lat], "ts", "end_ts"}]
    prev_positions = {}  # pack -> (lon, lat) rounded
    open_row = {}        # pack -> index in trail_features of its current cell
    last_snap_idx = {}   # pack -> index in `recent` where it was last reported
    latest_snapshot = None  # most recent snapshot's parsed GeoJSON

    for snap_idx, (ts_str, data) in enumerate(recent):
        latest_snapshot = data  # `recent` is sorted; final iteration wins
        ts = ts_str + "Z"

        for feat in data["features"]:
            props = feat["properties"]
            # Upstream named this field `name` from 2026-10-30 to 2026-11-02, and
            # 29 snapshots from those days are stored that way.
            if "pack" not in props and "name" in props:
                props["pack"] = props.pop("name")
            pack = props["pack"]
            ring = feat["geometry"]["coordinates"][0]
            # Centroid of hexbin (skip closing vertex)
            lons = [c[0] for c in ring[:-1]]
            lats = [c[1] for c in ring[:-1]]
            centroid = (sum(lons) / len(lons), sum(lats) / len(lats))
            pos = (round(centroid[0], 4), round(centroid[1], 4))

            # A cell keeps being republished for as long as the wolf stays in
            # it, so record the *window* it was reported over rather than one
            # row per snapshot. The window only continues through consecutive
            # snapshots: a wolf that drops out and later reappears in the same
            # cell gets a second row, so the break in reporting stays visible
            # instead of being smoothed into one long presence.
            continues = (
                prev_positions.get(pack) == pos
                and last_snap_idx.get(pack) == snap_idx - 1
            )
            if continues:
                trail_features[open_row[pack]]["properties"]["last_seen_ts"] = ts
                tracks[pack][-1]["end_ts"] = ts
            else:
                feat["properties"]["snapshot_ts"] = ts
                feat["properties"]["last_seen_ts"] = ts
                trail_features.append(feat)
                open_row[pack] = len(trail_features) - 1

                tracks.setdefault(pack, []).append({
                    "coords": [centroid[0], centroid[1]],
                    "ts": ts,
                    "end_ts": ts,
                })

            # `pack` is an individual wolf id and is renamed upstream from time
            # to time; `pack_origin` is the stable label the map styles by.
            origin = feat["properties"].get("pack_origin")
            if origin:
                tracks[pack][-1]["pack_origin"] = origin

            prev_positions[pack] = pos
            last_snap_idx[pack] = snap_idx

    # Build trail
    trail = {"type": "FeatureCollection", "features": trail_features}

    # Build tracks (only packs with ≥2 waypoints form a line).
    # `timestamps` / `end_timestamps` are parallel to the coordinates: each
    # waypoint carries the window its cell was reported over, which is what the
    # map's stepped playback mode shows (and what keeps it from inventing a
    # position in the gaps between reports).
    track_features = []
    for pack, wpts in sorted(tracks.items()):
        if len(wpts) < 2:
            continue
        origins = [w["pack_origin"] for w in wpts if w.get("pack_origin")]
        track_features.append({
            "type": "Feature",
            "properties": {
                "pack": pack,
                "pack_origin": origins[-1] if origins else None,
                "timestamps": [w["ts"] for w in wpts],
                "end_timestamps": [w["end_ts"] for w in wpts],
                "first_seen": wpts[0]["ts"],
                "last_seen": wpts[-1]["end_ts"],
                "waypoint_count": len(wpts),
            },
            "geometry": {
                "type": "LineString",
                "coordinates": [w["coords"] for w in wpts],
            },
        })
    track_geojson = {"type": "FeatureCollection", "features": track_features}

    # Stage the trail locally for DuckDB ST_Read; not uploaded as geojson.
    with open("/tmp/wolf_trail.geojson", "w") as fh:
        json.dump(trail, fh)

    # Upload tracks.geojson (visualization only — used by the map animation)
    with open("/tmp/wolf_tracks.geojson", "w") as fh:
        json.dump(track_geojson, fh)
    r = s3("cp", "/tmp/wolf_tracks.geojson",
           f"s3://{BUCKET}/wolf_tracks.geojson",
           "--content-type", "application/geo+json")
    if r.returncode != 0:
        print(f"ERROR uploading wolf_tracks.geojson: {r.stderr}", file=sys.stderr)
        sys.exit(1)

    # ---- Canonical analytical asset: H3 hex parquet -----------------------
    # Built fresh each run, overwriting the prior tiles in place. The full
    # 30-day trail is small (~hundreds of features → ~10K h8 rows → ~100 KB
    # parquet), so a wholesale overwrite is cheaper than partition surgery.
    if trail_features:
        con = duckdb.connect()
        con.execute("INSTALL spatial; LOAD spatial;")
        con.execute("INSTALL h3 FROM community; LOAD h3;")
        con.execute("SET temp_directory='/tmp';")
        con.execute("SET arrow_large_buffer_size=true;")

        local_dir = "/tmp/wolf_trail_hex"
        shutil.rmtree(local_dir, ignore_errors=True)

        con.execute(f"""
            COPY (
                WITH src AS (
                    SELECT
                        row_number() OVER () AS _cng_fid,
                        pack,
                        pack_origin,
                        most_recent_adj,
                        CAST(snapshot_ts AS TIMESTAMP) AS snapshot_ts,
                        CAST(last_seen_ts AS TIMESTAMP) AS last_seen_ts,
                        geom
                    FROM ST_Read('/tmp/wolf_trail.geojson')
                ),
                cells AS (
                    SELECT
                        _cng_fid, pack, pack_origin, most_recent_adj,
                        snapshot_ts, last_seen_ts,
                        UNNEST(h3_polygon_wkt_to_cells(
                            ST_AsText(ST_Force2D(geom)), {H3_RES}
                        )) AS h{H3_RES}
                    FROM src
                )
                SELECT
                    _cng_fid, pack, pack_origin, most_recent_adj,
                    snapshot_ts, last_seen_ts,
                    h{H3_RES},
                    h3_cell_to_parent(h{H3_RES}, 0) AS h0
                FROM cells
            )
            TO '{local_dir}'
            (FORMAT PARQUET, PARTITION_BY (h0), OVERWRITE_OR_IGNORE,
             COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)
        """)
        con.close()

        # `aws s3 sync --delete` evicts any h0 partition that no longer applies
        # (e.g. a wolf left a region and its tiles are stale).
        r = s3("sync", local_dir, f"s3://{BUCKET}/wolf_trail/hex", "--delete")
        if r.returncode != 0:
            print(f"ERROR syncing hex parquet: {r.stderr}", file=sys.stderr)
            sys.exit(1)
    else:
        print("No trail features in lookback window — skipping hex parquet.")

    print(f"Trail: {len(trail_features)} features, Tracks: {len(track_features)} packs with movement")

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wolf-tracker
  namespace: biodiversity
spec:
  schedule: "0 * * * *"           # hourly; CDFW updates roughly every 2 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        spec:
          priorityClassName: opportunistic
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: feature.node.kubernetes.io/pci-10de.present
                        operator: NotIn
                        values: ["true"]
          containers:
            - name: wolf-tracker
              image: ghcr.io/boettiger-lab/datasets:latest
              command: ["/bin/sh", "/scripts/fetch.sh"]
              resources:
                requests:
                  cpu: "1"
                  memory: "1Gi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: wolf-tracker-script
                defaultMode: 0755
